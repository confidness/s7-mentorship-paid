<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#04060f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="S7 Mentorship — find a mentor, take a course, hand your work in and have a person read it." />
    <title>S7 Mentorship</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Cpath d='M10 12h12v9a3 3 0 0 1-3 3h-6a3 3 0 0 1-3-3z' fill='white'/%3E%3Ccircle cx='13' cy='17' r='1.6' fill='%232563EB'/%3E%3Ccircle cx='19' cy='17' r='1.6' fill='%232563EB'/%3E%3Cpath d='M16 6v4' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

    <script>
      // Both axes, applied before first paint so the page never flashes the wrong one.
      // A skin is a whole palette, so getting this wrong is not a flicker — it is the site
      // repainting itself a second after it loads.
      try {
        var c = localStorage.getItem('s7-theme') || 'system'
        var dark = c === 'dark' || (c === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        // 'orbit' replaced 'plain' as the default. The settings page used to write 'plain'
        // back on sight, so a stored 'plain' from before then records a visit, not a choice —
        // it is moved once. A 'plain' picked after this is kept.
        var skin = localStorage.getItem('s7-skin')
        if (skin === 'plain' && localStorage.getItem('s7-skin-rev') !== '2') {
          skin = 'orbit'
          localStorage.setItem('s7-skin', skin)
        }
        localStorage.setItem('s7-skin-rev', '2')
        document.documentElement.dataset.skin = skin || 'orbit'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
        document.documentElement.dataset.skin = 'orbit'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
