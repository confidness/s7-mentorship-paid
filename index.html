<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#04060f" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Brandyzer — a brand kit for your small business, copy and photos in its voice, and freelancers who start from your brand." />
    <title>Brandyzer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E4572E'/%3E%3Crect x='9' y='7' width='4' height='18' rx='2' fill='white'/%3E%3Ccircle cx='17.5' cy='19' r='5' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

    <script>
      // Both axes, applied before first paint so the page never flashes the wrong one.
      // A skin is a whole palette, so getting this wrong is not a flicker — it is the site
      // repainting itself a second after it loads.
      try {
        var c = localStorage.getItem('brandyzer-theme') || 'system'
        var dark = c === 'dark' || (c === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.skin = localStorage.getItem('brandyzer-skin') || 'orbit'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
        document.documentElement.dataset.skin = 'orbit'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
