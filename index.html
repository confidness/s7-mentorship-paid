<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="S7 Mentorship — find a mentor, take a course, hand your work in and have a person read it." />
    <title>S7 Mentorship</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- What a link to the site shows when it is pasted into a chat or a feed. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="S7 Mentorship" />
    <meta property="og:title" content="S7 Mentorship" />
    <meta property="og:description" content="A mentor writes the lesson, prices it, and reads what you hand in." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="S7 Mentorship: a mentor writes the lesson, prices it, and reads what you hand in." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

    <script>
      // Both axes, applied before first paint so the page never flashes the wrong one.
      // A skin is a whole palette, so getting this wrong is not a flicker — it is the site
      // repainting itself a second after it loads. Light or dark is the device's setting;
      // a choice an older build stored under 's7-theme' is ignored, and main.tsx clears it.
      try {
        document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.skin = localStorage.getItem('s7-skin') || 'plain'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
        document.documentElement.dataset.skin = 'plain'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
